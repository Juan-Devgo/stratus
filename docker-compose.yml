# Solo la UI corre en Docker; el backend Go corre nativo en el host (necesita VBoxManage).
services:
  stratus-ui:
    build: ./stratus-ui
    # La UI queda disponible solo en el host local; no se expone a la red.
    ports:
      - "127.0.0.1:3000:3000"
    # Nombre portable para que nginx llegue al backend Go nativo en macOS y Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
