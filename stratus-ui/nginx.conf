server {
  # Compose publica este puerto únicamente en 127.0.0.1 porque la app no tiene autenticación.
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # API: se reenvía al backend Go nativo; 960 s porque una operación puede durar hasta 15 min
  location /api/ {
    proxy_pass http://host.docker.internal:8080;
    # Los archivos .tar.gz de servicios pueden pesar hasta 200 MB; el valor por defecto (1 MB) los rechazaría
    client_max_body_size 210m;
    proxy_read_timeout 960s;
    proxy_send_timeout 960s;
  }

  # SPA: cualquier ruta cae en index.html para que la resuelva React Router
  location / {
    try_files $uri /index.html;
  }
}
